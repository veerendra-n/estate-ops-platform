name: estate-ops
# Production stack for one platform instance on one VM: Caddy (HTTPS) in front of the API and console,
# the worker, Postgres, Neo4j Community, NATS JetStream and Temporal. No fakes, nothing published except
# ports 80 and 443; the Temporal UI and Neo4j Browser listen on 127.0.0.1 only (reach them over SSH).
# Run from this folder after install.sh has written .env:  docker compose up -d
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-platform: &platform
  build: ..
  image: estate-ops-platform:${PLATFORM_VERSION:-local}
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgresql://estate:${POSTGRES_PASSWORD:?run install.sh}@postgres:5432/estate_ops
    NEO4J_URL: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NATS_URL: nats://nats:4222
    TEMPORAL_ADDRESS: temporal:7233
    TENANTS_FILE: /config/tenants.yml
    CATALOG_FILE: /config/catalog.json
    SEED_FILE: ${SEED_FILE:-}
    PUBLIC_URL: https://${DOMAIN:?run install.sh}
  volumes:
    - ./local/tenants.yml:/config/tenants.yml:ro
    - ./local/catalog.json:/config/catalog.json:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    nats:
      condition: service_started
    temporal:
      condition: service_healthy
  mem_limit: 768m

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?run install.sh}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run install.sh}
      POSTGRES_DB: estate_ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate_ops"]
      interval: 3s
      retries: 40
    mem_limit: 1g

  neo4j:
    image: neo4j:5.26.32-community
    restart: unless-stopped
    logging: *logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run install.sh}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4jdata:/data
    ports:
      - "127.0.0.1:7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      interval: 3s
      retries: 60
    mem_limit: 1g

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    logging: *logging
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data
    mem_limit: 256m

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    logging: *logging
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: estate
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?run install.sh}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233 | grep -q SERVING"]
      interval: 3s
      retries: 80
    mem_limit: 768m

  temporal-ui:
    image: temporalio/ui:2.37.0
    restart: unless-stopped
    logging: *logging
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      - temporal
    mem_limit: 256m

  migrate:
    <<: *platform
    restart: "no"
    entrypoint: ["sh", "-c", "python -m estate_ops migrate && if [ -n \"$$SEED_FILE\" ]; then python -m estate_ops seed; fi"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  api:
    <<: *platform
    command: ["api", "--port", "8080"]

  worker:
    <<: *platform
    command: ["worker"]

volumes:
  pgdata:
  neo4jdata:
  natsdata:
  caddydata:
  caddyconfig:
