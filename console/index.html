<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estate Ops Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Estate Ops<small>AI-native managed IT</small></div>
    <nav class="views" aria-label="Case views">
      <button type="button" data-view="active" aria-current="page"><span>Needs attention</span><span class="count" id="n-active">0</span></button>
      <button type="button" data-view="approval"><span>Awaiting approval</span><span class="count" id="n-approval">0</span></button>
      <button type="button" data-view="agents"><span>With agents</span><span class="count" id="n-agents">0</span></button>
      <button type="button" data-view="closed"><span>Resolved</span><span class="count" id="n-closed">0</span></button>
    </nav>
    <h4>Customers</h4>
    <div id="tenants" class="tenants"></div>
    <div class="rail-foot" id="whoami"></div>
  </aside>

  <section class="queue" aria-label="Cases">
    <header class="qhead"><strong id="qtitle">Needs attention</strong><span class="muted" id="qsub"></span></header>
    <div id="cases" class="cases"></div>
  </section>

  <main class="workspace" id="workspace" aria-live="polite">
    <div class="empty">Pick a case. New alerts appear here within a few seconds.</div>
  </main>
</div>

<dialog id="signin">
  <form method="dialog" id="signin-form">
    <h2>Sign in to the console</h2>
    <label>Your name <input id="si-name" required autocomplete="name" placeholder="e.g. Priya Nair"></label>
    <label>Console token <input id="si-token" required type="password" autocomplete="off"></label>
    <p class="note">The name is recorded on every approval. Single sign-on replaces the shared token later.</p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js" type="module"></script>
</body>
</html>
