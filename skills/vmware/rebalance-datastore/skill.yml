id: vmware/rebalance-datastore
version: "1.0.0"
title: Move the noisiest VM off a slow datastore
summary: >-
  When a datastore is slow because one VM drives most of its IO, storage vMotion that VM to the datastore
  with the most headroom. It never moves a VM that a critical business service runs on, and escalates when
  no single VM explains the load.
risk: medium
approval: required
target:
  kind: datastore
connectors: [vcenter, metrics]
max_targets: 1
params:
  - name: latency_threshold_ms
    type: number
    default: 20
    min: 5
    max: 200
    description: The datastore counts as slow above this latency.
  - name: min_share
    type: number
    default: 0.4
    min: 0.1
    max: 1
    description: Share of the datastore's IO one VM must drive before moving it is the answer.
  - name: max_destination_latency_ms
    type: number
    default: 8
    min: 1
    max: 50
    description: Only move to a datastore this fast or faster.
  - name: verify_minutes
    type: integer
    default: 3
    min: 1
    max: 30
    description: How long to wait for the latency to recover after the move.
triggers:
  - alert: DatastoreLatencyHigh
rollback: Storage vMotion the VM back to the datastore named in the evidence (from).
notes: >-
  Reads per-VM IOPS from the metrics store, not from vCenter, so it works the same on Hyper-V once a
  hyperv connector exists. A storage vMotion of a busy VM adds load to both datastores while it runs.
